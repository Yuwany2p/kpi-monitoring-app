# ===================================================================
# SISTEM MANAJEMEN KPI PRODI / UPT
# Application Configuration (Spring Boot 3 + Supabase PostgreSQL)
# ===================================================================

spring.application.name=kpi-management
server.port=8080

# -------------------------------------------------------------------
# SUPABASE PROJECT CREDENTIALS
# -------------------------------------------------------------------
supabase.project-ref=uwxwxvpunrefywjdialr
supabase.url=https://uwxwxvpunrefywjdialr.supabase.co
supabase.publishable-key=sb_publishable_VEE8XvstXcJ8BT9MnDcZoQ_R87xDZIt

# -------------------------------------------------------------------
# 1. DATABASE CONFIGURATION (SUPABASE POSTGRESQL)
# -------------------------------------------------------------------
# Format Supabase:
# - Direct: jdbc:postgresql://db.uwxwxvpunrefywjdialr.supabase.co:5432/postgres?sslmode=require
# - Pooler: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require
#
# Catatan: Dapat di-override melalui Environment Variable DB_URL, DB_USER, DB_PASSWORD
# Contoh lokal: DB_URL=jdbc:postgresql://localhost:5432/postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://db.uwxwxvpunrefywjdialr.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# 2. FILE UPLOAD CONFIGURATION (LOCAL SERVER FOLDER)
# -------------------------------------------------------------------
app.upload.dir=uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# -------------------------------------------------------------------
# 3. THYMELEAF & WEB
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.kpi.prodi=DEBUG
