<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/main.css}">
    <style>
        .error-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F1F5F9;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 900;
            color: #0A192F;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <div class="card border-0 shadow-sm p-5" style="max-width: 500px;">
            <div class="error-code mb-2">404</div>
            <h4 class="fw-bold text-dark mb-2">Halaman Tidak Ditemukan</h4>
            <p class="text-muted mb-4">Halaman yang Anda cari tidak tersedia atau URL yang Anda masukkan salah.</p>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-navy px-4">
                    <i class="bi bi-arrow-left me-1"></i> Kembali ke Dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>
