<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: html}">
<head>
    <title>Manajemen Data Karyawan - Sistem KPI Prodi/UPT</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1">Manajemen Data Karyawan</h3>
                <p class="text-muted mb-0">Kelola pengguna sistem, peran hak akses (Role), dan status aktif akun.</p>
            </div>
            <div>
                <a th:href="@{/karyawan/create}" class="btn btn-navy d-flex align-items-center gap-2">
                    <i class="bi bi-person-plus-fill"></i>
                    <span>Tambah Karyawan</span>
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                <table class="table table-hover custom-table align-middle"
                       data-toggle="table"
                       data-search="true"
                       data-pagination="true"
                       data-page-size="10"
                       data-show-pagination-switch="false"
                       data-search-align="left"
                       data-buttons-align="right">
                    <thead>
                        <tr>
                            <th data-field="npk" data-sortable="true">NPK</th>
                            <th data-field="nama" data-sortable="true">Nama Karyawan</th>
                            <th data-field="role" data-sortable="true">Role</th>
                            <th data-field="bagian" data-sortable="true">Bagian / Unit</th>
                            <th data-field="username" data-sortable="true">Username</th>
                            <th data-field="status" data-sortable="true">Status</th>
                            <th class="text-end">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="k : ${karyawanList}">
                            <td class="fw-bold" th:text="${k.npk}">K001</td>
                            <td>
                                <div class="fw-semibold text-dark" th:text="${k.namaKaryawan}">Nama Lengkap</div>
                                <small class="text-muted" th:text="${k.gender}">Gender</small>
                            </td>
                            <td>
                                <span th:if="${k.role.name() == 'KAPROD'}" class="badge bg-danger">KAPROD</span>
                                <span th:if="${k.role.name() == 'SEKPROD'}" class="badge bg-primary">SEKPROD</span>
                                <span th:if="${k.role.name() == 'KAUPT'}" class="badge bg-info text-dark">KAUPT</span>
                                <span th:if="${k.role.name() == 'PIC_ACTIVITY'}" class="badge bg-secondary">PIC_ACTIVITY</span>
                            </td>
                            <td th:text="${k.bagian}">Prodi</td>
                            <td><code><span th:text="${k.username}">user</span></code></td>
                            <td>
                                <span th:if="${k.statusAktif}" class="badge bg-success-subtle text-success border border-success-subtle">AKTIF</span>
                                <span th:unless="${k.statusAktif}" class="badge bg-danger-subtle text-danger border border-danger-subtle">NONAKTIF</span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{'/karyawan/edit/' + ${k.npk}}" class="btn btn-outline-primary" title="Edit Karyawan">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>

                                    <!-- Toggle Status Button -->
                                    <form th:action="@{'/karyawan/toggle/' + ${k.npk}}" method="POST" class="d-inline">
                                        <button type="submit" class="btn btn-outline-warning" th:title="${k.statusAktif ? 'Nonaktifkan Akun' : 'Aktifkan Akun'}">
                                            <i class="bi" th:classappend="${k.statusAktif ? 'bi-lock' : 'bi-unlock'}"></i>
                                        </button>
                                    </form>

                                    <!-- Delete Button (Except current logged in user) -->
                                    <form th:if="${currentUser != null && !currentUser.npk.equals(k.npk)}"
                                          th:action="@{'/karyawan/delete/' + ${k.npk}}" method="POST" class="d-inline">
                                        <button type="button" class="btn btn-outline-danger btn-confirm-delete"
                                                data-title="Hapus Karyawan?"
                                                th:data-text="'Data karyawan ' + ${k.namaKaryawan} + ' (' + ${k.npk} + ') akan dihapus secara permanen.'">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
